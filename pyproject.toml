[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battwin-probabilistic"
version = "0.2.1"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Probabilistic battery manufacturing models, uncertainty propagation and constrained process design"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.4", "pandas>=2.0,<2.3", "scipy>=1.11,<1.17", "scikit-learn>=1.4,<1.9", "xgboost>=2,<4", "xgboostlss==0.6.1", "torch>=2.1,<2.10", "joblib>=1.3", "optuna>=3.5,<5", "matplotlib>=3.8,<3.11", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "nbformat"]

[project.scripts]
battwin = "battwin_probabilistic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
